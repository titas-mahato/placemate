version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: placemate_db
      MYSQL_USER: placemate_user
      MYSQL_PASSWORD: placemate_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_USER: placemate_user
      DB_PASSWORD: placemate_password
      DB_NAME: placemate_db
      SECRET_KEY: dev-secret-key-placemate
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  db_data:
